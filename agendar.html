<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/agendar.css">
    <title>Document</title>
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            BARBEARIA
            <span>ALEX</span>
        </div>

        <nav>
            <a href="index.html">inicio</a>
            <a href="servicos.html">servicos</a>
            <a href="agendar.html">agendar</a>
            <a href="#">contatos</a>
        </nav>

        <button class="btn-entrar">
            Entrar
        </button>

    </header>

    <main>
        <section class="agendamento">
            <h1> 
                Agende seu horario
            </h1>
            <p>Preencha seus dados abaixo para marca seu atendimento.</p>

            <form id="form-agendar">
                <label for="nome">Nome completo</label>
                <input type="text"id="nome" name="nome" required>

                <label for="telefone">Telefone / whatsApp</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

                <label for="servicos">Serviço</label>
                <select id="servicos" name="servico" required>

                    <option value="">
                        Selecione um serviço
                    </option>

                    <option value="corte">Corte</option>

                     <option value="barba">Barba</option>

                     <option value="corte-barba">Corte + Barba </option>

                     <option value="sobrancelha">Sobrancelha</option>

                     <option value="corte-sobrancelha">Corte + sobrancelha</option>

                </select>

                <label for="data">Data</label>
                <input type="date" id="data" name="data" required>

                <label for="horario">Horário</label>
                <select id="horario" name="horario" required>
                     
                    <option value="">
                        Selecione um horário
                    </option>

                    <option value="09:00">09:00</option>

                    <option value="10:00">10:00</option>

                    <option value="11:00">11:00</option>

                    <option value="13:00">13:00</option>

                    <option value="14:00">14:00</option>

                    <option value="15:00">15:00</option>

                    <option value="16:00">16:00</option>

                    <option value="17:00">17:00</option>

                    <option value="18:00">18:00</option>

                    <option value="19:00">19:00</option>
                </select>

                <button type="submit" class="btn-agendar">Confirmar agendamento</button>
            </form>

            <div id="mensagem-confirmacao" class="escondido">
                <p>
                    ✅ Agendamento recebido!
                    Entraremos em contato para confirmar.
                </p>
            </div>

            <div class="whatsapp-agendar">
                <p>
                    Prefere agendar direto pelo WhatsApp?
                </p>

                <a href="#" terget="_blank">
                    Agendar pelo WhatsApp
                </a>
            </div>

        </section>
    </main>

    
</body>
</html>
