<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/recuperar-senha.css">
    <title>Document</title>
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            BARBEARIA
            <span>ALEX</span>
        </div>

        <nav>
            <a href="index.html">inicio</a>
            <a href="servicos.html">servicos</a>
            <a href="agendar.html">agendar</a>
            <a href="#">contatos</a>
        </nav>

    </header>

    <main class="container-recuperar-senha">

        <section class="formulario-recuperar-senha">
            <h1>Recuperar senha</h1>
            <p>
                Esqueceu sua senha? Informe seu e-mail para iniciar a recuperação do acesso à sua conta.
            </p>

            <form id="form-recuperar-senha" action="#" method="post">
                <div class="campo-recuperar-senha">

                    <label for="email">E-mail cadastrado</label>

                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                </div>

                <button type="submit" class="btn-recuperar-senha">
                    Recuperar minha senha
                </button>
            </form>

            <p class="voltar-login">
                Lembrou seu senha?
                <a href="login.html">Voltar para o login</a>
            </p>

        </section>
        
    </main>
    
</body>
</html>
